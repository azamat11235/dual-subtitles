<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>panel</title>
<style>/* ───────────────────────────── Subtitle overlay ─────────────────────────────── */

.ds-overlay {
  position: absolute;
  left: 0;
  right: 0;
  /* Where YouTube rests its own captions: bottom 2% of the player. */
  bottom: 2%;
  z-index: 25;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--ds-gap, 4px);

  pointer-events: none;
  text-align: center;
  transition: bottom 0.18s ease-out;
}

/* When the control bar is visible, lift the subtitles above it —
   exactly as YouTube itself does. */
.html5-video-player:not(.ytp-autohide) .ds-overlay {
  bottom: calc(2% + 52px);
}

.ds-overlay--hidden { display: none; }

/* A position set by dragging. The container shrinks to its content and is
   centred on the point it was dragged to. */
.ds-overlay--custom {
  left: var(--ds-x, 50%);
  right: auto;
  bottom: var(--ds-y, 2%);
  width: max-content;
  max-width: 88%;
  transform: translateX(-50%);
}

/* Subtitles placed by hand stay where they were put: the control bar does not
   push them around, because the user already chose the spot. */
.html5-video-player:not(.ytp-autohide) .ds-overlay--custom {
  bottom: var(--ds-y, 2%);
}

.ds-overlay--dragging { transition: none; }

.ds-line {
  display: none;
  max-width: 88%;
}

.ds-overlay--custom .ds-line { max-width: 100%; }

.ds-line--visible { display: block; }

.ds-text {
  display: inline;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;

  padding: 0.1em 0.38em;
  border-radius: 3px;
  background: var(--ds-bg, rgba(8, 8, 8, 0.55));

  font-family: "YouTube Noto", Roboto, "Arial Unicode Ms", Arial, Helvetica, sans-serif;
  font-size: var(--ds-base, 24px);
  font-weight: 500;
  line-height: 1.3;
  white-space: pre-wrap;
  text-shadow: 0 0 2px rgba(0, 0, 0, 0.85);

  pointer-events: auto;

  /* The block is dragged with the mouse, like YouTube's own subtitles, and the
     cursor says so. Selecting text still works through a double click for a word
     and a triple click for the whole line — neither needs a drag, so neither
     competes with moving the block. */
  cursor: move;
  user-select: text;
  -webkit-user-select: text;
}

.ds-overlay--dragging .ds-text {
  cursor: grabbing;
  user-select: none;
  -webkit-user-select: none;
}

.ds-line--primary .ds-text { color: var(--ds-primary-color, #fff); }

.ds-line--secondary .ds-text {
  color: var(--ds-secondary-color, #7fd1ff);
  font-size: calc(var(--ds-base, 24px) * 0.88);
  font-weight: 400;
}

/* Hide YouTube's own subtitles while we draw ours. */
.ds-hide-native .ytp-caption-window-container { display: none !important; }

/* ─────────────────────────── Button in the player bar ──────────────────────── */

/* The button no longer carries .ytp-button: that class drags in layout rules
   that break it on the current player (an svg padding that overflows the box,
   and display:none in a narrow window). So it brings its own reset, and ui.js
   copies the box of a neighbouring control onto it. */
.ds-btn {
  position: relative;
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  padding: 0;
  border: 0;
  background: transparent;
  color: #fff;
  cursor: pointer;
  opacity: 0.9;
  transition: opacity 0.1s;
}

.ds-btn:hover { opacity: 1; }

.ds-btn:focus { outline: 0; }

/* The hover treatment the player gives its own controls: a pill behind the
   glyph, and a tooltip above it. Both are keyed to .ytp-button in YouTube's
   stylesheet, and wearing that class breaks the layout, so they are reproduced
   here -- the pill from the player's own colour variables, so it follows the
   theme, with the same 40px radius that turns into a circle on a square button. */
.ds-btn::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  /* Not the button's own box: the player draws this shorter than the button, so
     it reads as a pill rather than a circle. 48x32 inside a 48x40 button here,
     and it follows the same variable the player sizes it by. */
  width: 48px;
  height: calc(var(--yt-delhi-pill-height, 48px) - 8px);

  border-radius: 40px;
  background-color: transparent;
  pointer-events: none;
  transition: background-color 0.2s cubic-bezier(0.05, 0, 0, 1);
}

.ytp-big-mode:not(.ytp-xsmall-width-mode) .ds-btn::before {
  width: var(--yt-delhi-big-mode-pill-height, 56px);
  height: calc(var(--yt-delhi-big-mode-pill-height, 56px) - 8px);
}

.ytp-xsmall-width-mode .ds-btn::before {
  width: 32px;
  height: 32px;
  border-radius: 50%;
}

.ds-btn:hover::before {
  background-color: var(--yt-sys-color-baseline--overlay-button-secondary, rgba(255, 255, 255, 0.1));
}

.ds-btn:active::before {
  background-color: var(--yt-sys-color-baseline--overlay-tonal-hover, rgba(255, 255, 255, 0.2));
}

/* Measured off the player's own tooltip: the bubble is 66x25 around a 48x15
   text box, which is 5px and 9px of padding, and it floats 21.8px above the top
   of the button. */
.ds-btn::after {
  content: attr(data-title);
  position: absolute;
  bottom: calc(100% + 22px);
  left: 50%;
  transform: translateX(-50%);

  padding: 5px 9px;
  border-radius: 8px;
  /* .ytp-tooltip-bottom-text, the layer that actually paints the bubble: 30%
     black, so the frame shows through. The solid .ytp-tooltip-bg alongside it
     is not used for this kind of tooltip and measures 0x0. */
  background: rgba(0, 0, 0, 0.3);

  color: rgb(238, 238, 238);
  font-family: "YouTube Noto", Roboto, Arial, Helvetica, sans-serif;

  /* The player sizes its tooltip at 118% of its own font, and that font grows
     with the player -- 11px normally, 17px in big mode. Ours hangs off the
     button, which the control bar has already scaled to 1.09 of the player, so
     118 / 1.09 lands on the same pixel in both: 12.98px and 20.06px. A fixed
     13px was right in one player size and wrong in every other. */
  font-size: 108.26%;
  font-weight: 500;
  line-height: 15px;
  letter-spacing: normal;
  /* The player's tooltip text carries this, solid black rather than the softer
     one on the panel. Without it the same size and weight still read as a
     lighter, sharper typeface than its neighbours'. */
  text-shadow: rgb(0, 0, 0) 0 0 2px;
  white-space: nowrap;

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.1s;
}

.ds-btn:hover::after,
.ds-btn:focus-visible::after { opacity: 1; }

/* No tooltip while a menu is open. The player's own buttons stay quiet then --
   its tooltips are drawn from script, which simply does not offer one, so there
   is no rule to inherit and ours has to be told. */
.ytp-settings-shown .ds-btn:hover::after,
.ytp-settings-shown .ds-btn:focus-visible::after,
.ds-holding-controls .ds-btn:hover::after,
.ds-holding-controls .ds-btn:focus-visible::after { opacity: 0; }

/* .ytp-big-mode .ytp-tooltip { line-height: 22px }, matched. */
.ytp-big-mode .ds-btn::after { line-height: 22px; }

/* Fallback for a control bar with no neighbour to measure. */
.ds-btn svg {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  /* .ytp-settings-button svg, matched: the glyph turns while its panel is open. */
  transition: transform 0.1s cubic-bezier(0.4, 0, 1, 1);
}

.ds-btn[aria-expanded="true"] svg { transform: rotate(30deg); }

.ds-btn .ds-btn-underline {
  position: absolute;
  left: 50%;
  bottom: 8px;
  width: 18px;
  height: 3px;
  margin-left: -9px;
  border-radius: 2px;
  background: #ff0000;
  opacity: 0;
  transition: opacity 0.1s;
}

.ds-btn--active .ds-btn-underline { opacity: 1; }

.ds-btn--busy svg { animation: ds-pulse 1.1s ease-in-out infinite; }

@keyframes ds-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

/* ──────────────────────────── Settings panel ───────────────────────────────── */

.ds-panel {
  position: absolute;

  /* Where the player puts its own menu: 12px in from the right and 6px above
     the control bar, whose height it keeps in a variable. Measured at 62px here
     and 78px in big mode; a flat 60px only matched one of them. */
  right: 12px;
  bottom: calc(var(--yt-delhi-bottom-controls-height, 56px) + 6px);
  z-index: 2300;

  width: 340px;
  max-height: min(560px, calc(100% - 90px));
  overflow-y: auto;
  padding: 0;
  box-sizing: border-box;

  /* The player's own menu: translucent black, 12px radius, no shadow. */
  background: rgba(0, 0, 0, 0.6);
  border-radius: 12px;

  color: #eee;
  font-family: "YouTube Noto", Roboto, Arial, Helvetica, sans-serif;
  font-size: 14px;
  line-height: 1.3;
  /* .ytp-popup carries this, and it is what keeps the text readable where the
     panel is only 60% opaque over a bright frame. */
  text-shadow: rgba(0, 0, 0, 0.5) 0 0 2px;

  cursor: default;

  /* Closed, it stays in the tree and fades, exactly as .ytp-popup does: in on
     one curve, out on another. Toggling `hidden` gave it no way to fade at all. */
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.1s cubic-bezier(0.4, 0, 1, 1);
}

.ds-panel--open {
  opacity: 1;
  pointer-events: auto;
  transition: opacity 0.1s cubic-bezier(0, 0, 0.2, 1);
}

.ytp-big-mode .ds-panel {
  bottom: calc(var(--yt-delhi-big-mode-bottom-controls-height, 72px) + 6px);
}

/* While our panel is open the control bar stays up with it, the way the player
   keeps its own menus company. The class above does the work; this is the
   belt-and-braces for a layout that hides the bar by opacity alone. */
/* While our panel is open the player's own buttons stay quiet too, exactly as
   they do while one of its menus is up. */
.ds-holding-controls .ytp-tooltip { display: none !important; }

.ds-holding-controls .ytp-chrome-bottom {
  opacity: 1 !important;
  pointer-events: auto !important;
}
</style><style>/* ──────────────────────── Settings form, shared ─────────────────────────────── */
/* The same form is drawn in two places — the panel inside the player and the
   extension popup — by one piece of code, so it is dressed by one stylesheet.
   Only where the form sits differs: that stays in overlay.css and popup.css.

   The vocabulary is YouTube's own settings menu, measured from it: 48px rows,
   14px labels in #eee with values in rgba(255,255,255,.7), a 12px radius on the
   shell, 40x24 pill toggles, and no borders anywhere. Ours carries controls the
   player's menu has no equivalent for — sliders, colours, a text field — and
   those are dressed in the same palette rather than invented afresh. */

.ds-row[hidden],
.ds-panel__section[hidden] { display: none; }

.ds-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 48px;
  /* .ytp-panel-menu keeps 8px around its items, so a row's hover mark stops
     short of the panel edge; the text still lands 16px in. */
  margin: 0 8px;
  padding: 0 8px;
  font-size: 14px;
}

/* .ytp-menuitem:not([aria-disabled="true"]):hover, matched. */
.ds-row:hover { background: rgba(255, 255, 255, 0.1); }

/* The glyph column, sized as the player's: a 24px icon, then 24px of space made
   of this margin plus the row's gap, so labels start 64px in from the edge
   exactly as its own menu does. */
.ds-icon {
  flex: none;
  width: 24px;
  height: 24px;
  /* 12px here plus the row's own 12px gap: the label lands 64px from the panel
     edge, where the player puts its own. */
  margin-right: 12px;
  color: #eee;
}

.ds-icon svg { display: block; width: 24px; height: 24px; }

/* Rows with no glyph keep the same text column. */
.ds-row > label:first-child { margin-left: 48px; }
.ds-row > .ds-icon + label { margin-left: 0; }
.ds-row > .ds-switch:first-child { margin-left: 48px; }
.ds-row > .ds-icon + .ds-switch { margin-left: 0; }

/* The label takes the slack, so everything after it is pushed against the right
   edge as one group. Without this the row spread its three parts evenly and the
   sliders floated at a different offset in every row. */
.ds-row > label {
  flex: 1 1 auto;
  min-width: 0;
  color: #eee;
}

/* A choice reads as the value it currently holds, and opens a submenu. */
.ds-row--menu { cursor: pointer; }

.ds-value {
  /* Shrinks far more readily than the label beside it: with both shrinking
     evenly a long value squeezed the label until its text spilled across. This
     one has an ellipsis to fall back on; the label does not. */
  flex: 0 100 auto;
  min-width: 0;
  padding-right: 20px;
  color: rgba(255, 255, 255, 0.7);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='rgba(255,255,255,0.7)'%3E%3Cpath d='M9.29 6.71 14.59 12l-5.3 5.29 1.42 1.42L17.41 12l-6.7-6.71z'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right center;
  background-size: 16px 16px;
}

.ds-row--menu:hover .ds-value { color: #fff; }
.ds-row--menu:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.5); outline-offset: -1px; }

/* ------------------------------- the submenu -------------------------------- */
/* .ytp-panel-header and its list, measured: a 56px header over a 1px divider,
   48px options, and a 35px gutter on the left for the tick. */

.ds-submenu__header {
  display: flex;
  align-items: center;
  min-height: 56px;
  box-sizing: border-box;
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
}

.ds-submenu__back {
  flex: none;
  width: 48px;
  height: 48px;
  padding: 0;
  border: 0;
  background-color: transparent;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='%23fff'%3E%3Cpath d='m19.41 20.09-4.58-4.59 4.58-4.59L18 9.5l-6 6 6 6z'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 32px 32px;
  cursor: pointer;
}

.ds-submenu__title {
  font-size: 12px;
  font-weight: 500;
  color: #eee;
}

.ds-submenu__list { padding: 8px 0; }

.ds-option {
  display: flex;
  align-items: center;
  min-height: 48px;
  margin: 0 8px;
  padding: 0 20px 0 35px;
  font-size: 14px;
  color: #eee;
  cursor: pointer;

  background-repeat: no-repeat;
  background-position: 9px center;
  background-size: 18px 18px;
}

.ds-option:hover { background-color: rgba(255, 255, 255, 0.1); }
.ds-option:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.5); outline-offset: -1px; }
.ds-option[aria-checked="true"] { background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fff'%3E%3Cpath d='M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z'/%3E%3C/svg%3E"); }

/* Moving between the list and a submenu, the way the player moves between its
   own panels: the two slide past each other while the surface takes on the
   height of the one arriving. .ytp-popup-animating puts the same 0.25s curve on
   .ytp-panel, and the panels sit on top of each other at translateX(+-100%).

   The views are only taken out of flow while that runs, so at rest the panel is
   exactly as tall as whichever view is showing. */
.ds-form { position: relative; }

/* Stacked only while a swap runs, so the outgoing view can still be seen on its
   way out. The movement itself comes from script, so both sides keep one clock. */
.ds-form--animating .ds-view {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
}


.ds-row input[type="text"] {
  flex: 0 1 auto;
  min-width: 0;
  max-width: 58%;
  padding: 7px 10px;
  border: 0;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.1);
  color: #eee;
  font: inherit;
  font-size: 13px;
}

.ds-row input[type="text"]:focus { outline: 1px solid rgba(255, 255, 255, 0.4); }

.ds-row input[type="range"] {
  flex: 0 1 auto;
  width: 116px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.3);
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
}

.ds-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #fff;
}

.ds-row input[type="color"] {
  flex: none;
  width: 38px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: none;
  cursor: pointer;
}

.ds-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.ds-row input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 6px; }

/* A checkbox reads as a switch, the way every toggle in the player's menu does. */
.ds-row > label.ds-switch,
.ds-switch {
  display: flex;
  flex: 1 1 auto;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: #eee;
  cursor: pointer;
  user-select: none;
}

.ds-switch input[type="checkbox"] {
  order: 2;                      /* the label is written first, the switch sits right */
  flex: none;
  position: relative;
  width: 40px;
  height: 24px;
  margin: 0;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.2);
  cursor: pointer;
  transition: background-color 0.15s;

  -webkit-appearance: none;
  appearance: none;
}

.ds-switch input[type="checkbox"]::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.15s;
}

.ds-switch input[type="checkbox"]:checked { background: rgba(255, 255, 255, 0.55); }
.ds-switch input[type="checkbox"]:checked::after { transform: translateX(16px); }
.ds-switch input[type="checkbox"]:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.6); }

.ds-panel__section {
  margin: 0;
  padding: 16px 16px 6px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.ds-status {
  margin: 10px 16px;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.7);
  font-size: 12px;
  line-height: 1.4;
}

.ds-status--error { background: rgba(255, 80, 80, 0.16); color: #ffb4b4; }
.ds-status--work { background: rgba(255, 255, 255, 0.12); color: rgba(255, 255, 255, 0.85); }

.ds-range-value {
  flex: 0 0 38px;
  color: rgba(255, 255, 255, 0.7);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.ds-btn-secondary {
  flex: none;
  padding: 7px 14px;
  border: 0;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.1);
  color: #eee;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.ds-btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
</style>

<script>
const store = { captionX: 0.5, captionY: 0.1 };
const listeners = [];
window.chrome = { runtime: { id: 'preview', sendMessage: () => Promise.resolve({ ok: true, shortcut: 'Alt+D' }) },
  commands: { getAll: () => Promise.resolve([]) },
  storage: { sync: { get: d => Promise.resolve(Object.assign({}, d, store)),
                     set: p => { const ch = {}; for (const k in p) { store[k] = p[k]; ch[k] = { newValue: p[k] }; } listeners.forEach(f => f(ch, 'sync')); return Promise.resolve(); } },
             onChanged: { addListener: f => listeners.push(f) } } };
</script>
<script>/**
 * Shared helpers and settings. First script in the content-script chain — it
 * creates the window.DS namespace that every other file uses (all content
 * scripts of one extension share a single isolated world).
 */
(() => {
  const DS = (window.DS = window.DS || {});

  const DEBUG = false;
  DS.log = (...a) => DEBUG && console.log('%c[dual-subs]', 'color:#3ea6ff', ...a);
  DS.warn = (...a) => console.warn('[dual-subs]', ...a);

  /** Default settings. Stored in chrome.storage.sync. */
  DS.DEFAULTS = {
    enabled: true,
    // 'auto' = the language of the video itself; otherwise a code ('en', 'ru', ...)
    primaryLang: 'auto',
    secondaryLang: 'ru',
    // Allow machine translation when there is no ready-made track
    // Translation provider. 'youtube' is YouTube's own built-in translation.
    translator: 'youtube',
    deeplKey: '',
    // Appearance
    fontSize: 100,        // % of the base size
    lineGap: 4,           // px between the lines
    // Where the block was dragged to, as fractions of the player size (X is the
    // centre of the block, Y its distance from the bottom). null means it was
    // never dragged and the resting place near the bottom edge is used.
    captionX: null,
    captionY: null,
    background: 55,       // backdrop opacity, %
    primaryColor: '#ffffff',
    secondaryColor: '#7fd1ff',
    // Behaviour
    pauseOnHover: false   // pause when the mouse is over the subtitles
  };

  let cache = null;
  const listeners = new Set();

  /**
   * Whether this script can still reach the extension.
   *
   * Reloading an unpacked extension does not replace the copy already running
   * in an open tab; it cuts it off. Every chrome.* call from then on throws
   * "Extension context invalidated", which is what a dead settings panel looks
   * like from the outside -- buttons that do nothing at all.
   */
  const connected = () => { try { return !!chrome.runtime?.id; } catch { return false; } };
  DS.connected = connected;

  const teardowns = new Set();
  let tornDown = false;
  DS.onTeardown = (fn) => teardowns.add(fn);
  /** Takes our own additions back off the page and leaves it as we found it. */
  DS.teardown = () => {
    if (tornDown) return;
    tornDown = true;
    for (const fn of teardowns) { try { fn(); } catch { /* going away anyway */ } }
    teardowns.clear();
  };

  DS.getSettings = async () => {
    if (cache) return cache;
    if (!connected()) return (cache = { ...DS.DEFAULTS });
    try {
      const stored = await chrome.storage.sync.get(DS.DEFAULTS);
      cache = { ...DS.DEFAULTS, ...stored };
    } catch {
      DS.teardown();
      cache = { ...DS.DEFAULTS };
    }
    return cache;
  };

  DS.setSettings = async (patch) => {
    cache = { ...(cache || DS.DEFAULTS), ...patch };
    if (!connected()) { DS.teardown(); return cache; }
    try {
      await chrome.storage.sync.set(patch);
    } catch {
      DS.teardown();
      return cache;
    }
    // storage.onChanged carries this back to every listener, this tab included.
    return cache;
  };

  DS.onSettingsChange = (fn) => listeners.add(fn);

  try {
    chrome.storage.onChanged.addListener((changes, area) => {
      if (area !== 'sync') return;
      const patch = {};
      for (const [k, v] of Object.entries(changes)) patch[k] = v.newValue;
      cache = { ...(cache || DS.DEFAULTS), ...patch };
      listeners.forEach((fn) => fn(cache, patch));
    });
  } catch { /* already cut off */ }

  /** Human-readable language name. */
  const displayNames = (() => {
    try { return new Intl.DisplayNames(['en'], { type: 'language' }); } catch { return null; }
  })();
  DS.languageName = (code) => {
    if (!code || code === 'auto') return 'Video language';
    try {
      const n = displayNames?.of(code);
      if (n && n !== code) return n[0].toUpperCase() + n.slice(1);
    } catch { /* unknown code — show it as it is */ }
    return code;
  };

  /**
   * The keyboard shortcut as this platform writes it.
   *
   * macOS has no Alt key: the same physical key is Option, written ⌥. Chrome
   * hands the binding over in whatever spelling it likes, so anything already in
   * symbols is passed through untouched and only the ASCII names are mapped.
   */
  const MAC = /mac/i.test(navigator.userAgentData?.platform || navigator.platform || '');
  const KEY_SYMBOL = {
    command: '⌘', cmd: '⌘', meta: '⌘',
    ctrl: '⌃', control: '⌃', macctrl: '⌃',
    alt: '⌥', option: '⌥', opt: '⌥',
    shift: '⇧'
  };

  DS.shortcutLabel = (shortcut) => {
    if (!shortcut) return '';
    if (!MAC) return shortcut;
    // On a Mac the parts are written side by side, without separators.
    return shortcut.split('+').map((part) => {
      const key = part.trim();
      return KEY_SYMBOL[key.toLowerCase()] || key;
    }).join('');
  };

  /**
   * What the shortcut is actually bound to — it can be changed or cleared in the
   * browser's own settings, and an empty string means it is unbound.
   *
   * chrome.commands is out of reach from a content script, so there the question
   * goes to the background worker.
   */
  DS.getShortcut = async (name = 'toggle-dual-subs') => {
    try {
      if (chrome.commands?.getAll) {
        const all = await chrome.commands.getAll();
        return all.find((c) => c.name === name)?.shortcut || '';
      }
      const r = await chrome.runtime.sendMessage({ type: 'shortcut', name });
      return r?.shortcut || '';
    } catch {
      return ''; // worker asleep or extension reloaded — show the label bare
    }
  };

  DS.sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  DS.debounce = (fn, ms) => {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  };

  /** Unique key of a track — used to compare it against the user's choice. */
  DS.trackKey = (t) => (t ? `${t.languageCode}|${t.kind || ''}|${t.name || ''}` : '');

  /** Waits for an element to appear in the DOM. */
  DS.waitFor = (selector, timeout = 15000) => new Promise((resolve) => {
    const found = document.querySelector(selector);
    if (found) return resolve(found);
    const obs = new MutationObserver(() => {
      const el = document.querySelector(selector);
      if (el) { obs.disconnect(); clearTimeout(timer); resolve(el); }
    });
    obs.observe(document.documentElement, { childList: true, subtree: true });
    const timer = setTimeout(() => { obs.disconnect(); resolve(null); }, timeout);
  });

  DS.videoIdFromUrl = (url = location.href) => {
    try {
      const u = new URL(url);
      if (u.pathname === '/watch') return u.searchParams.get('v');
      const m = u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{6,})/);
      return m ? m[1] : null;
    } catch { return null; }
  };
})();
</script><script>/**
 * Builder for the settings form. The same form appears in two places: the panel
 * inside the player (where the track list of the current video is known) and the
 * extension popup (where only the common languages are known).
 *
 * The only difference between them is where the language list comes from, so it
 * is passed in from outside through getLangOptions().
 *
 * A choice is made the way the player makes one: the row shows the current value
 * and opens a submenu listing the alternatives with a tick beside the current
 * one. A native <select> would drop a browser menu over the video, which looks
 * nothing like the rest of the player.
 */
(() => {
  const DS = (window.DS = window.DS || {});

  /** Languages for the popup, where the video's track list is unavailable. */
  DS.COMMON_LANGS = [
    'ru', 'en', 'uk', 'de', 'fr', 'es', 'it', 'pt', 'pl', 'tr',
    'ar', 'zh-Hans', 'ja', 'ko', 'hi', 'kk', 'be', 'nl', 'sv', 'cs', 'he', 'id', 'vi'
  ];

  const TRANSLATORS = [
    { value: 'youtube', label: 'YouTube translation (fast, no limits)' },
    { value: 'google', label: 'Google Translate (free)' },
    { value: 'deepl', label: 'DeepL (free key required, best quality)' },
    { value: 'mymemory', label: 'MyMemory (fallback, small quota)' }
  ];

  const SCHEMA = [
    { section: 'Languages' },
    { key: 'primaryLang', label: 'First', type: 'lang', role: 'primary' },
    { key: 'secondaryLang', label: 'Second', type: 'lang', role: 'secondary' },
    { key: 'translator', label: 'Translator', type: 'select', options: TRANSLATORS },
    { key: 'deeplKey', label: 'DeepL key', type: 'text', placeholder: 'xxxx-xxxx-...:fx',
      when: (s) => s.translator === 'deepl' },

    { section: 'Appearance' },
    { key: 'fontSize', label: 'Size', type: 'range', min: 60, max: 200, step: 5, suffix: '%' },
    { key: 'background', label: 'Backdrop', type: 'range', min: 0, max: 100, step: 5, suffix: '%' },
    { key: 'primaryColor', label: 'First language colour', type: 'color' },
    { key: 'secondaryColor', label: 'Second language colour', type: 'color' },
    { key: 'resetPosition', label: 'Subtitles were dragged', type: 'button', buttonLabel: 'Put back',
      when: (s) => s.captionX != null || s.captionY != null,
      action: () => DS.setSettings({ captionX: null, captionY: null }) },

    { section: 'Behaviour' },
    { key: 'pauseOnHover', label: 'Pause on hover', type: 'bool' }
  ];


  /**
   * A glyph for every row, the way the player's menu carries one.
   *
   * 24x24 like its own, drawn from plain shapes rather than lifted: the column
   * is what matters for the eye, not the artwork.
   */
  const ICONS = {
    enabled: '<rect x="2.5" y="5.5" width="19" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="5.5" y="9.5" width="13" height="1.8" rx=".9"/><rect x="5.5" y="13" width="8" height="1.8" rx=".9"/>',
    primaryLang: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9h17M3.5 15h17" stroke="currentColor" stroke-width="1.6" fill="none"/>',
    secondaryLang: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9h17M3.5 15h17" stroke="currentColor" stroke-width="1.6" fill="none"/>',
    translator: '<rect x="2.5" y="3.5" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="9.5" y="10.5" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 8.5h6M8.5 5.5v6" stroke="currentColor" stroke-width="1.6"/>',
    deeplKey: '<circle cx="7.5" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11.5 12H21M18 12v3.5M15 12v2.5" stroke="currentColor" stroke-width="1.6" fill="none"/>',
    fontSize: '<path d="M2 19 7 5h2l5 14h-2l-1.2-3.5H5.2L4 19H2Zm3.8-5.3h3.4L7.5 8.6 5.8 13.7Z"/><path d="M14.5 19 18 9.5h1.6L23 19h-1.7l-.8-2.4h-3.5L16.2 19h-1.7Zm2.9-3.8h2.6l-1.3-3.8-1.3 3.8Z"/>',
    background: '<rect x="3.5" y="3.5" width="17" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M20 8v10.5a2 2 0 0 1-2 2H8L20 8Z"/>',
    primaryColor: '<circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.6"/>',
    secondaryColor: '<circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.6"/>',
    resetPosition: '<path d="M12 5a7 7 0 1 1-6.6 9.3l1.9-.6A5 5 0 1 0 12 7v2.5L7.8 6.2 12 3v2Z"/>',
    pauseOnHover: '<rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/>'
  };

  DS.rowIcon = function rowIcon(key) {
    const shape = ICONS[key];
    if (!shape) return null;
    const holder = document.createElement('span');
    holder.className = 'ds-icon';
    holder.setAttribute('aria-hidden', 'true');
    holder.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor">${shape}</svg>`;
    return holder;
  };

  const isMenu = (item) => item.type === 'lang' || item.type === 'select';

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /** Flattens the option groups the caller may have used. */
  const flatten = (options) => options.flatMap((o) => (o.group ? o.options : [o]));

  /**
   * @param {HTMLElement} root       where to render
   * @param {object} opts
   * @param {(role:string)=>Array} opts.getLangOptions
   */
  DS.buildSettingsForm = function buildSettingsForm(root, opts) {
    const rows = [];
    let settings = { ...DS.DEFAULTS };

    root.classList.add('ds-form');
    const list = el('div', 'ds-view ds-view--list');
    const submenu = el('div', 'ds-view ds-view--submenu');
    submenu.hidden = true;
    root.appendChild(list);
    root.appendChild(submenu);

    /**
     * Slides one view out while the other comes in, and takes the surface's
     * height with it -- the way the player moves between its own panels.
     *
     * The views only become absolute for the duration: in rest the visible one
     * sits in normal flow, so the panel is exactly as tall as its contents
     * without anyone having to measure it.
     */
    // The surface that actually changes size: the panel in the player, or the
    // form itself in the popup, where the window follows its content.
    const shell = root.closest('.ds-panel') || root;

    const DURATION = 300;                       // .ytp-popup-animating declares 250
    const EASING = 'cubic-bezier(0.4, 0, 0.2, 1)';
    const LEAVE = 120;                          // the old view goes first,
    const ARRIVE = DURATION - LEAVE;            // the new one follows it
    const TRAVEL = 16;                          // px -- a hint of direction, not a sweep
    const stillMotion = () => window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;

    let settle = null;
    /**
     * Moves between the list and a submenu.
     *
     * The surface reshapes, the way the player's menu does -- its panels sit
     * absolutely inside a box that clips them, and what animates is the box's
     * own width and height. Dragging a whole panel's width across the opening,
     * which is what this did before, is a far brisker movement.
     *
     * The reshape alone is not enough, though: where the panel is already at its
     * ceiling both views are taller than it, the height has nowhere to go, and
     * the change would land with no movement at all. So the views also hand over
     * -- one out, then the other in, rather than both at once, which would have
     * them washing through each other in the middle.
     */
    function swap(from, to, direction) {
      const back = direction === 'back';
      settle?.();

      // Both heights are read with the views in normal flow, so a ceiling on the
      // panel has already been applied to them.
      const startHeight = shell.offsetHeight;
      from.hidden = true;
      to.hidden = false;
      const endHeight = shell.offsetHeight;
      from.hidden = false;

      const finish = () => {
        settle = null;
        root.classList.remove('ds-form--animating');
        shell.style.overflow = '';
        from.hidden = true;
      };

      if (stillMotion() || !shell.animate) { finish(); return; }

      root.classList.add('ds-form--animating');
      shell.style.overflow = 'hidden';

      const running = [
        from.animate(
          [{ opacity: 1, transform: 'translateX(0)' },
            { opacity: 0, transform: `translateX(${back ? TRAVEL : -TRAVEL}px)` }],
          { duration: LEAVE, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'both' }
        ),
        to.animate(
          [{ opacity: 0, transform: `translateX(${back ? -TRAVEL : TRAVEL}px)` },
            { opacity: 1, transform: 'translateX(0)' }],
          { duration: ARRIVE, delay: LEAVE, easing: 'cubic-bezier(0, 0, 0.2, 1)', fill: 'both' }
        )
      ];
      if (startHeight !== endHeight) {
        running.push(shell.animate(
          [{ height: `${startHeight}px` }, { height: `${endHeight}px` }],
          { duration: DURATION, easing: EASING, fill: 'both' }
        ));
      }

      const done = () => {
        clearTimeout(timer);
        // Layout first, animations second: cancelling drops the filled values in
        // the same tick, and the other way round the surface fell to its natural
        // size for a frame and sprang back.
        finish();
        for (const a of running) a.cancel();
      };
      // An animation in a document the browser has stopped painting never
      // reports finished, and the surface would keep `overflow: hidden` for
      // good. The clock is the backstop, not the timing.
      const timer = setTimeout(() => { if (settle === done) done(); }, DURATION + 250);
      settle = done;
      Promise.all(running.map((a) => a.finished))
        .then(() => { if (settle === done) done(); })
        .catch(() => {});
    }

    const optionsFor = (item) =>
      (item.type === 'lang' ? opts.getLangOptions(item.role) : item.options);

    /** What the row shows: the label of the chosen option, or the value itself. */
    function currentLabel(item) {
      const value = settings[item.key];
      const hit = flatten(optionsFor(item)).find((o) => o.value === value);
      if (hit) return hit.label;
      // A language saved earlier that this video has no track for.
      return item.type === 'lang' ? `${DS.languageName(value)} (not on this video)` : String(value ?? '');
    }

    function closeSubmenu({ animate = false } = {}) {
      settle?.();
      if (submenu.hidden) return;
      if (!animate) {
        submenu.hidden = true;
        submenu.textContent = '';
        list.hidden = false;
        return;
      }
      swap(submenu, list, 'back');
    }

    function openSubmenu(entry) {
      const { item } = entry;
      const options = optionsFor(item);
      const value = settings[item.key];
      submenu.textContent = '';

      const header = el('div', 'ds-submenu__header');
      const back = el('button', 'ds-submenu__back');
      back.type = 'button';
      back.setAttribute('aria-label', 'Back');
      back.addEventListener('click', () => closeSubmenu({ animate: true }));
      header.appendChild(back);
      header.appendChild(el('span', 'ds-submenu__title', item.label));
      submenu.appendChild(header);

      const body = el('div', 'ds-submenu__list');
      const choose = (v) => {
        settings[item.key] = v;
        entry.value.textContent = currentLabel(item);
        DS.setSettings({ [item.key]: v });
        applyVisibility();
        closeSubmenu({ animate: true });
      };
      const addOption = (o) => {
        const node = el('div', 'ds-option', o.label);
        node.setAttribute('role', 'menuitemradio');
        node.setAttribute('aria-checked', String(o.value === value));
        node.tabIndex = 0;
        node.addEventListener('click', () => choose(o.value));
        node.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(o.value); }
        });
        body.appendChild(node);
      };

      for (const o of options) {
        if (o.group) {
          body.appendChild(el('div', 'ds-panel__section', o.group));
          o.options.forEach(addOption);
        } else {
          addOption(o);
        }
      }
      // Keep a saved choice reachable even when this video cannot offer it.
      if (value != null && !flatten(options).some((o) => o.value === value)) {
        addOption({ value, label: currentLabel(item) });
      }

      submenu.appendChild(body);
      submenu.scrollTop = 0;
      swap(list, submenu, 'forward');
      back.focus();
    }

    for (const item of SCHEMA) {
      if (item.section) {
        const s = el('div', 'ds-panel__section', item.section);
        list.appendChild(s);
        rows.push({ item, node: s });
        continue;
      }

      const row = el('div', 'ds-row');
      const icon = DS.rowIcon(item.key);
      if (icon) row.appendChild(icon);
      let input;
      let value;

      if (isMenu(item)) {
        row.classList.add('ds-row--menu');
        row.setAttribute('role', 'menuitem');
        row.setAttribute('aria-haspopup', 'true');
        row.tabIndex = 0;
        row.appendChild(el('label', null, item.label));
        value = el('span', 'ds-value');
        row.appendChild(value);
        const entry = { item, node: row, value };
        row.addEventListener('click', () => openSubmenu(entry));
        row.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSubmenu(entry); }
        });
        list.appendChild(row);
        rows.push(entry);
        continue;
      }

      if (item.type === 'bool') {
        const lab = el('label', 'ds-switch');
        input = document.createElement('input');
        input.type = 'checkbox';
        lab.appendChild(input);
        lab.appendChild(el('span', null, item.label));
        row.appendChild(lab);
      } else if (item.type === 'button') {
        row.appendChild(el('label', null, item.label));
        input = document.createElement('button');
        input.type = 'button';
        input.className = 'ds-btn-secondary';
        input.textContent = item.buttonLabel;
        input.addEventListener('click', () => item.action());
        row.appendChild(input);
      } else {
        row.appendChild(el('label', null, item.label));
        if (item.type === 'range') {
          input = document.createElement('input');
          input.type = 'range';
          input.min = item.min;
          input.max = item.max;
          input.step = item.step;
        } else if (item.type === 'color') {
          input = document.createElement('input');
          input.type = 'color';
        } else {
          input = document.createElement('input');
          input.type = 'text';
          if (item.placeholder) input.placeholder = item.placeholder;
        }
        row.appendChild(input);
        if (item.type === 'range') {
          const out = el('span', 'ds-range-value');
          row.appendChild(out);
          input._output = out;
        }
      }

      // A button carries no value: it fires its action and that is all.
      if (item.type !== 'button') {
        const commit = () => {
          const v = item.type === 'bool' ? input.checked
            : item.type === 'range' ? Number(input.value)
              : input.value;
          settings[item.key] = v;
          if (input._output) input._output.textContent = v + (item.suffix || '');
          DS.setSettings({ [item.key]: v });
          applyVisibility();
        };

        // Sliders and colours update live, everything else on change.
        input.addEventListener(item.type === 'range' || item.type === 'color' ? 'input' : 'change', commit);
      }

      list.appendChild(row);
      rows.push({ item, node: row, input });
    }

    function applyVisibility() {
      for (const r of rows) {
        if (r.item.when) r.node.hidden = !r.item.when(settings);
      }
    }

    /** Writes the current settings into the rows, without disturbing the view. */
    function syncRows() {
      for (const r of rows) {
        const { item } = r;
        if (isMenu(item)) { r.value.textContent = currentLabel(item); continue; }
        if (!r.input || item.type === 'button') continue;
        const value = settings[item.key];
        if (item.type === 'bool') r.input.checked = !!value;
        else r.input.value = value;
        if (r.input._output) r.input._output.textContent = value + (item.suffix || '');
      }
      applyVisibility();
    }

    async function refresh() {
      settings = await DS.getSettings();
      closeSubmenu();
      syncRows();
    }

    // A setting can change from the popup, from the other surface, or from a
    // button here that writes it straight out -- "Put back" did exactly that,
    // and its own row stayed on screen afterwards as if nothing had happened.
    DS.onSettingsChange((next) => {
      settings = next;
      syncRows();
    });

    // The caller puts its own furniture inside the list view, so that it slides
    // away with the rest when a submenu opens.
    return { refresh, listView: list };
  };
})();
</script>
