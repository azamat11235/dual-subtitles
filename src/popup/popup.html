<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>Dual subtitles</title>
</head>
<body>
  <header class="head">
    <h1>Dual subtitles</h1>
    <label class="ds-switch head__toggle">
      <input type="checkbox" id="enabled">
      <span>On</span>
    </label>
  </header>

  <p class="hint" id="hint">
    These are the defaults. On a video page you can change them with the
    <b>dual subtitles</b> button in the player controls.
  </p>

  <div id="form"></div>

  <footer class="foot">
    <button type="button" id="clearCache" class="linklike">Clear translation cache</button>
    <span id="cacheInfo" class="muted"></span>
  </footer>

  <script src="../content/util.js"></script>
  <script src="../common/settings-form.js"></script>
  <script src="popup.js"></script>
</body>
</html>
